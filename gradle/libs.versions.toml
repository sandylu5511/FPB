[versions]
agp = "8.7.3"
kotlin = "2.0.21"
composeBom = "2024.12.01"
activityCompose = "1.10.0"
biometric = "1.1.0"
fragment = "1.8.9"
bouncycastle = "1.77"
junit = "4.13.2"
# 仪器测试（androidTest）用：验证硬件密钥规格是否真被平台接受，
# 这类事 JVM 单测做不了 —— android.jar 里的 android.* 方法全是 stub。
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.8.7" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
# 生物识别用 androidx 版本而不是平台 BiometricPrompt：
# 平台实现在部分国产 ROM 上不弹框或直接失败，androidx 里带了对这些机型的兜底。
# 代价是它要求宿主是 FragmentActivity（FragmentActivity 继承自 ComponentActivity，因此 setContent 照常用）。
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
# 关键修复：biometric 1.1.0 传递依赖的 fragment 1.2.5 会在 FragmentActivity
# 里对 requestCode 强制 16 位校验，而 activity 1.9+/1.10+ 的
# ActivityResultRegistry 分配的是 >= 0x10000 的随机 requestCode，
# 两者叠加导致所有 rememberLauncherForActivityResult.launch() 必崩
# （IllegalArgumentException: Can only use lower 16 bits for requestCode）。
# fragment 1.8.9 移除了该校验并把未知 code 交回 ComponentActivity 处理，
# 与 activity 1.10.0 是官方配套组合。
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
